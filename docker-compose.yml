# Two Next.js instances behind a round-robin proxy, sharing one Redis cache.
#   docker compose up --build
#   open http://localhost:8090/posts        (reload: the "generated by" line never changes)
#   curl -X POST 'http://localhost:8090/api/revalidate?tag=posts&hard=true'
#   docker compose run --rm cli ls
x-app: &app
  build:
    context: .
    args:
      EXAMPLE: ${EXAMPLE:-isr-app}
  environment: &app-env
    REDIS_URL: redis://redis:6379
    # One prefix per deployment: never share entries between two builds of the app.
    CACHE_PREFIX: ${CACHE_PREFIX:-cacheforge-demo}
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  app-a:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-a

  app-b:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-b

  gateway:
    image: nginx:alpine
    ports:
      - '${GATEWAY_PORT:-8090}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app-a, app-b]

  cli:
    profiles: [tools]
    build:
      context: .
    entrypoint: ['node', '/app/packages/cli/dist/bin.js']
    environment:
      CACHEFORGE_REDIS: redis://redis:6379
      CACHEFORGE_PREFIX: ${CACHE_PREFIX:-cacheforge-demo}
    depends_on: [redis]
